<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED79E" />
      <stop offset="35%" stop-color="#CFA85C" />
      <stop offset="70%" stop-color="#E7D297" />
      <stop offset="100%" stop-color="#A57C32" />
    </linearGradient>
    <linearGradient id="ogGoldStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B88E3E" />
      <stop offset="50%" stop-color="#F2DFAC" />
      <stop offset="100%" stop-color="#9C7326" />
    </linearGradient>
  </defs>
  <!-- Monogram OG Mark -->
  <g transform="translate(160, 48) scale(0.85)">
    <!-- Outer O capsule/arch -->
    <path d="M-28,-36 C-28,-46 -18,-52 0,-52 C18,-52 28,-46 28,-36 L28,24 C28,34 18,40 0,40 C-18,40 -28,34 -28,24 Z" 
          fill="none" stroke="url(#ogGold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Inner G monogram loop -->
    <path d="M-12,-24 C-12,-32 -6,-36 0,-36 C8,-36 14,-30 14,-20 L14,12 C14,22 8,26 0,26 C-8,26 -14,20 -14,10 L-14,-2 C-14,-6 -10,-8 -6,-8 L6,-8" 
          fill="none" stroke="url(#ogGoldStroke)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Decorative inner fine accents -->
    <path d="M-4,-24 C-1,-26 2,-26 5,-24" fill="none" stroke="#FAF2DC" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <!-- OAK GALLERIE -->
  <text x="160" y="128" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Trajan Pro', 'Bodoni MT', 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="3.5" fill="#1C1814">OAK GALLERIE</text>
  
  <!-- BY ADITYA NAHATA -->
  <text x="160" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="9" font-weight="600" letter-spacing="3.8" fill="#584C3E">BY ADITYA NAHATA</text>
  
  <!-- Crafted Luxury Furniture -->
  <text x="160" y="174" text-anchor="middle" font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-style="italic" font-size="12" letter-spacing="1" fill="#756450">Crafted Luxury Furniture</text>
</svg>
